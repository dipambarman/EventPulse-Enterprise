<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="900"
   height="600"
   viewBox="0 0 900 600"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <style>
    .entity { fill: #cce5ff; stroke: #004085; stroke-width: 2; }
    .weak-entity { fill: #ffe5cc; stroke: #cc6600; stroke-width: 2; stroke-dasharray: 4 2; }
    .attribute { fill: #e2e3e5; stroke: #6c757d; stroke-width: 1; }
    .key-attribute { fill: #b8daff; stroke: #004085; stroke-width: 2; }
    .relationship { fill: #d4edda; stroke: #155724; stroke-width: 2; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #212529; }
    .line { stroke: #212529; stroke-width: 1.5; }
    .fk { stroke-dasharray: 5 3; }
  </style>

  <!-- Entities -->
  <rect x="50" y="50" width="160" height="120" class="entity" />
  <text x="130" y="75" class="text" text-anchor="middle" font-weight="bold">themes</text>
  <rect x="70" y="90" width="120" height="25" class="key-attribute" />
  <text x="130" y="110" class="text" text-anchor="middle">id (PK)</text>
  <rect x="70" y="120" width="120" height="20" class="attribute" />
  <text x="130" y="135" class="text" text-anchor="middle">name</text>
  <rect x="70" y="145" width="120" height="20" class="attribute" />
  <text x="130" y="160" class="text" text-anchor="middle">description</text>
  <rect x="70" y="170" width="120" height="20" class="attribute" />
  <text x="130" y="185" class="text" text-anchor="middle">price</text>

  <rect x="300" y="50" width="160" height="140" class="entity" />
  <text x="380" y="75" class="text" text-anchor="middle" font-weight="bold">users</text>
  <rect x="320" y="90" width="120" height="25" class="key-attribute" />
  <text x="380" y="110" class="text" text-anchor="middle">id (PK)</text>
  <rect x="320" y="120" width="120" height="20" class="attribute" />
  <text x="380" y="135" class="text" text-anchor="middle">username</text>
  <rect x="320" y="145" width="120" height="20" class="attribute" />
  <text x="380" y="160" class="text" text-anchor="middle">email</text>
  <rect x="320" y="170" width="120" height="20" class="attribute" />
  <text x="380" y="185" class="text" text-anchor="middle">password_hash</text>

  <rect x="550" y="50" width="160" height="140" class="entity" />
  <text x="630" y="75" class="text" text-anchor="middle" font-weight="bold">bookings</text>
  <rect x="570" y="90" width="120" height="25" class="key-attribute" />
  <text x="630" y="110" class="text" text-anchor="middle">id (PK)</text>
  <rect x="570" y="120" width="120" height="20" class="attribute" />
  <text x="630" y="135" class="text" text-anchor="middle">theme_id (FK)</text>
  <rect x="570" y="145" width="120" height="20" class="attribute" />
  <text x="630" y="160" class="text" text-anchor="middle">user_id (FK)</text>
  <rect x="570" y="170" width="120" height="20" class="attribute" />
  <text x="630" y="185" class="text" text-anchor="middle">start_date</text>
  <rect x="570" y="195" width="120" height="20" class="attribute" />
  <text x="630" y="210" class="text" text-anchor="middle">end_date</text>

  <rect x="50" y="250" width="160" height="120" class="entity" />
  <text x="130" y="275" class="text" text-anchor="middle" font-weight="bold">payments</text>
  <rect x="70" y="310" width="120" height="25" class="key-attribute" />
  <text x="130" y="330" class="text" text-anchor="middle">id (PK)</text>
  <rect x="70" y="280" width="120" height="20" class="attribute" />
  <text x="130" y="295" class="text" text-anchor="middle">booking_id (FK)</text>
  <rect x="70" y="305" width="120" height="20" class="attribute" />
  <text x="130" y="320" class="text" text-anchor="middle">amount</text>

  <rect x="300" y="250" width="160" height="100" class="entity" />
  <text x="380" y="275" class="text" text-anchor="middle" font-weight="bold">roles</text>
  <rect x="320" y="310" width="120" height="25" class="key-attribute" />
  <text x="380" y="330" class="text" text-anchor="middle">id (PK)</text>
  <rect x="320" y="280" width="120" height="20" class="attribute" />
  <text x="380" y="295" class="text" text-anchor="middle">name</text>

  <rect x="550" y="250" width="160" height="80" class="weak-entity" />
  <text x="630" y="275" class="text" text-anchor="middle" font-weight="bold">user_roles</text>
  <rect x="570" y="300" width="120" height="20" class="key-attribute" />
  <text x="630" y="315" class="text" text-anchor="middle">user_id (PK, FK)</text>
  <rect x="570" y="320" width="120" height="20" class="key-attribute" />
  <text x="630" y="335" class="text" text-anchor="middle">role_id (PK, FK)</text>

  <rect x="50" y="400" width="160" height="100" class="entity" />
  <text x="130" y="425" class="text" text-anchor="middle" font-weight="bold">theme_categories</text>
  <rect x="70" y="450" width="120" height="25" class="key-attribute" />
  <text x="130" y="470" class="text" text-anchor="middle">id (PK)</text>
  <rect x="70" y="475" width="120" height="20" class="attribute" />
  <text x="130" y="490" class="text" text-anchor="middle">name</text>

  <rect x="300" y="400" width="160" height="80" class="weak-entity" />
  <text x="380" y="425" class="text" text-anchor="middle" font-weight="bold">theme_category_mapping</text>
  <rect x="320" y="450" width="120" height="20" class="key-attribute" />
  <text x="380" y="465" class="text" text-anchor="middle">theme_id (PK, FK)</text>
  <rect x="320" y="470" width="120" height="20" class="key-attribute" />
  <text x="380" y="485" class="text" text-anchor="middle">category_id (PK, FK)</text>

  <rect x="550" y="400" width="160" height="100" class="entity" />
  <text x="630" y="425" class="text" text-anchor="middle" font-weight="bold">audit_logs</text>
  <rect x="570" y="450" width="120" height="25" class="key-attribute" />
  <text x="630" y="470" class="text" text-anchor="middle">id (PK)</text>
  <rect x="570" y="475" width="120" height="20" class="attribute" />
  <text x="630" y="490" class="text" text-anchor="middle">user_id (FK)</text>
  <rect x="570" y="505" width="120" height="20" class="attribute" />
  <text x="630" y="520" class="text" text-anchor="middle">action</text>

  <!-- Relationships -->
  <!-- bookings to themes -->
  <line x1="210" y1="110" x2="570" y2="135" class="line" />
  <text x="390" y="120" class="text" text-anchor="middle">1</text>
  <text x="390" y="140" class="text" text-anchor="middle">N</text>

  <!-- bookings to users -->
  <line x1="460" y1="110" x2="570" y2="160" class="line" />
  <text x="515" y="120" class="text" text-anchor="middle">1</text>
  <text x="515" y="140" class="text" text-anchor="middle">N</text>

  <!-- payments to bookings -->
  <line x1="130" y1="280" x2="630" y2="110" class="line" />
  <text x="380" y="200" class="text" text-anchor="middle">1</text>
  <text x="380" y="220" class="text" text-anchor="middle">1</text>

  <!-- user_roles to users -->
  <line x1="380" y1="310" x2="570" y2="315" class="line fk" />
  <text x="475" y="310" class="text" text-anchor="middle">1</text>
  <text x="475" y="330" class="text" text-anchor="middle">N</text>

  <!-- user_roles to roles -->
  <line x1="460" y1="310" x2="630" y2="335" class="line fk" />
  <text x="545" y="310" class="text" text-anchor="middle">1</text>
  <text x="545" y="330" class="text" text-anchor="middle">N</text>

  <!-- theme_category_mapping to themes -->
  <line x1="210" y1="460" x2="380" y2="465" class="line fk" />
  <text x="295" y="450" class="text" text-anchor="middle">1</text>
  <text x="295" y="480" class="text" text-anchor="middle">N</text>

  <!-- theme_category_mapping to theme_categories -->
  <line x1="460" y1="460" x2="540" y2="485" class="line fk" />
  <text x="500" y="450" class="text" text-anchor="middle">1</text>
  <text x="500" y="480" class="text" text-anchor="middle">N</text>

  <!-- audit_logs to users -->
  <line x1="460" y1="470" x2="630" y2="490" class="line fk" />
  <text x="545" y="470" class="text" text-anchor="middle">0..1</text>
  <text x="545" y="490" class="text" text-anchor="middle">N</text>

</svg>
