version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: event_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./backend/services/api-gateway
      dockerfile: Dockerfile
    command: node server.js
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AUTH_SERVICE_URL=http://auth-service:5001
      - THEME_SERVICE_URL=http://theme-service:5002
      - BOOKING_SERVICE_URL=http://booking-service:5003
      - PAYMENT_SERVICE_URL=http://payment-service:5004
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
    depends_on:
      - auth-service
      - theme-service
      - booking-service
      - payment-service
      - notification-service

  auth-service:
    build:
      context: ./backend/services/auth-service
      dockerfile: Dockerfile
    command: node server.js
    ports:
      - "5001:5001"
    environment:
      - AUTH_SERVICE_PORT=5001
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=event_management
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
    depends_on:
      mysql:
        condition: service_healthy

  theme-service:
    build:
      context: ./backend/services/theme-service
      dockerfile: Dockerfile
    command: node server.js
    ports:
      - "5002:5002"
    environment:
      - THEME_SERVICE_PORT=5002
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=event_management
    depends_on:
      mysql:
        condition: service_healthy

  booking-service:
    build:
      context: ./backend/services/booking-service
      dockerfile: Dockerfile
    command: node server.js
    ports:
      - "5003:5003"
    environment:
      - BOOKING_SERVICE_PORT=5003
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=event_management
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
    depends_on:
      mysql:
        condition: service_healthy

  payment-service:
    build:
      context: ./backend/services/payment-service
      dockerfile: Dockerfile
    command: node server.js
    ports:
      - "5004:5004"
    environment:
      - PAYMENT_SERVICE_PORT=5004
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=event_management
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
    depends_on:
      mysql:
        condition: service_healthy

  notification-service:
    build:
      context: ./backend/services/notification-service
      dockerfile: Dockerfile
    command: node server.js
    ports:
      - "5005:5005"
    environment:
      - NOTIFICATION_SERVICE_PORT=5005
      - SMTP_HOST=${SMTP_HOST:-smtp.ethereal.email}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}

volumes:
  mysql_data:
