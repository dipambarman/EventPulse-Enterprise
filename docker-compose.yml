version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "cringe[]"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api-gateway:
    build:
      context: ./backend/services/api-gateway
      dockerfile: Dockerfile
    command: node server.js
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AUTH_SERVICE_URL=http://auth-service:5001
      - THEME_SERVICE_URL=http://theme-service:5002
      - BOOKING_SERVICE_URL=http://booking-service:5003
      - PAYMENT_SERVICE_URL=http://payment-service:5004
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
    depends_on:
      - auth-service
      - theme-service
      - booking-service
      - payment-service
      - notification-service

  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    command: node server.js
    ports:
      - "5001:5001"
    environment:
      - AUTH_SERVICE_PORT=5001
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD="cringe[]"
      - DB_NAME=eventpulse_users
      - DATABASE_URL=mysql://root:cringe[]@mysql:3306/eventpulse_users
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  theme-service:
    build:
      context: ./backend
      dockerfile: services/theme-service/Dockerfile
    command: node server.js
    ports:
      - "5002:5002"
    environment:
      - THEME_SERVICE_PORT=5002
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD="cringe[]"
      - DB_NAME=eventpulse_themes
      - DATABASE_URL=mysql://root:cringe[]@mysql:3306/eventpulse_themes
    depends_on:
      mysql:
        condition: service_healthy

  booking-service:
    build:
      context: ./backend
      dockerfile: services/booking-service/Dockerfile
    command: node server.js
    ports:
      - "5003:5003"
    environment:
      - BOOKING_SERVICE_PORT=5003
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD="cringe[]"
      - DB_NAME=eventpulse_bookings
      - DATABASE_URL=mysql://root:cringe[]@mysql:3306/eventpulse_bookings
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    build:
      context: ./backend
      dockerfile: services/payment-service/Dockerfile
    command: node server.js
    ports:
      - "5004:5004"
    environment:
      - PAYMENT_SERVICE_PORT=5004
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD="cringe[]"
      - DB_NAME=eventpulse_payments
      - DATABASE_URL=mysql://root:cringe[]@mysql:3306/eventpulse_payments
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    command: node server.js
    ports:
      - "5005:5005"
    environment:
      - NOTIFICATION_SERVICE_PORT=5005
      - SMTP_HOST=${SMTP_HOST:-smtp.ethereal.email}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-noreply@eventpulse.io}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  mysql_data:
  rabbitmq_data:
